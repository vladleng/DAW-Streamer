name: Publish v0.3.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Publish v0.3.0 release'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build Release
        run: cmake --build --preset windows-x64-release

      - name: Test Release
        run: ctest --preset windows-x64-release --output-on-failure

      - name: Package Windows x64 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = 'release/DAW-Streamer-v0.3.0-windows-x64'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          $plugin = Get-ChildItem -Path 'build/windows-x64' -Recurse -Directory -Filter 'DAW Streamer.vst3' |
            Where-Object { $_.FullName -match '\\Release\\VST3\\' } |
            Select-Object -First 1
          $recorder = Get-ChildItem -Path 'build/windows-x64' -Recurse -File -Filter 'DAW Streamer Recorder.exe' |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1

          if ($null -eq $plugin) { throw 'DAW Streamer.vst3 was not found in the Release build.' }
          if ($null -eq $recorder) { throw 'DAW Streamer Recorder.exe was not found in the Release build.' }

          Copy-Item -Path $plugin.FullName -Destination "$packageRoot/DAW Streamer.vst3" -Recurse
          Copy-Item -Path $recorder.FullName -Destination "$packageRoot/DAW Streamer Recorder.exe"
          Copy-Item -Path 'README.md' -Destination "$packageRoot/README.md"

          Compress-Archive -Path "$packageRoot/*" -DestinationPath 'DAW-Streamer-v0.3.0-windows-x64.zip' -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 `
            --target "${{ github.sha }}" `
            --title 'DAW Streamer v0.3.0' `
            --notes-file 'docs/release-v0.3.0.md' `
            'DAW-Streamer-v0.3.0-windows-x64.zip#Windows x64 build'

  sync-notes:
    if: (github.event_name == 'push' && github.event.head_commit.message == 'Refresh v0.3.0 release notes') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.3.0 --notes-file docs/release-v0.3.0.md
