name: Windows build

on:
  push:
    branches:
      - main
      - stage-5a1-startup-drop-fix
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build Release
        run: cmake --build --preset windows-x64-release

      - name: Test Release
        run: ctest --preset windows-x64-release --output-on-failure

      - name: Upload Stage 5A1 binaries
        uses: actions/upload-artifact@v4
        with:
          name: DAW-Streamer-stage5a1-windows-x64
          if-no-files-found: error
          path: |
            build/windows-x64/**/Release/VST3/DAW Streamer.vst3/**
            build/windows-x64/**/Release/DAW Streamer Recorder.exe
